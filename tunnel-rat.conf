# Tunnel R.A.T. — configuration
#
# Use only on networks you own or are explicitly authorized to test.
# Values are read by scripts/tunnel-rat.sh and the caplet.

# Network interface (left blank = auto-detect the default route interface)
INTERFACE=

# Scope of the authorized test (the network/range you have permission to assess).
# Single host: 192.168.50.100   Range: 192.168.50.0/24
TEST_SCOPE=192.168.50.0/24

# Packet capture
PACKET_CAPTURE_ENABLED=true
CAPTURE_DIR=/opt/tunnel-rat/captures

# Discovery scan options (nmap)
SCAN_ENABLED=false
SCAN_ARGS=-sV

# DNS redirection (lab only — point at a host inside your own test range,
# e.g. a local honeypot or a lab web server you control). Disabled by default.
DNS_REDIRECT_ENABLED=false
DNS_REDIRECT_DOMAINS=lab.local
DNS_REDIRECT_TARGET=192.168.50.1

# Local HTTP proxy for inspecting your own lab traffic. Disabled by default.
HTTP_PROXY_ENABLED=false
HTTP_PROXY_PORT=8081

# Remote management (reverse SSH to a server YOU own, for managing your own
# device remotely). Fill in your own server details to use it. Disabled by default.
REMOTE_MGMT_ENABLED=false
REMOTE_MGMT_USER=youruser
REMOTE_MGMT_SERVER=your-server.example
REMOTE_MGMT_PORT=2222

# Logging
LOG_DIR=/opt/tunnel-rat/logs
DEBUG_MODE=false
