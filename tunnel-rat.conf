# Tunnel R.A.T. Configuration File

# Network Interface (auto-detect if blank)
INTERFACE=eth0

# Target IP(s) for ARP spoof
# Examples:
#   Single target: 192.168.1.100
#   Multiple: 192.168.1.100,192.168.1.101
#   Subnet: 192.168.1.0/24
ARP_TARGETS=192.168.1.0/24

# DNS Spoof Configuration
DNS_SPOOF_ENABLED=false
DNS_SPOOF_DOMAINS=example.com,evil.com

# HTTP Proxy Configuration
HTTP_PROXY_ENABLED=false
HTTP_PROXY_PORT=8080

# Packet Capture Configuration
PACKET_CAPTURE_ENABLED=true
CAPTURE_FILE=/opt/tunnel-rat/captures/packets.pcap

# Network Scan Configuration
NMAP_ENABLED=false
NMAP_ARGS=-sV -sC

# Remote SSH Access
SSH_TUNNEL_ENABLED=false
SSH_REMOTE_USER=username
SSH_REMOTE_SERVER=your-server.com
SSH_LOCAL_PORT=2222

# Logging
LOG_FILE=/opt/tunnel-rat/tunnel-rat.log
DEBUG_MODE=false

# Persistent Mode (auto-start on boot)
PERSISTENT_MODE=false
